substitutions:
  device_name:   "ezplug-073548"
  friendly_name: "EZPlug"
  relay_restore_mode: RESTORE_DEFAULT_OFF # ALWAYS_ON | ALWAYS_OFF

# TH3D EZPlug v2 (ESP32-C3 / ESP8685, 4MB, BL0937)
# Pinout read from Tasmota "Gpio 255" on 172.16.3.68, MAC 3C:DC:75:07:35:48
esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # enable failback
  ap:
    ssid: "${device_name} hotspot"
    password: !secret wifi_ap_failback_password

preferences:
  flash_write_interval: "1h" #save flash write cycles

captive_portal:

logger:
  hardware_uart: USB_SERIAL_JTAG # GPIO20 (UART0 RX) is the button
api:
ota:
  - platform: esphome

web_server:
  port: 80

# Device Specific Config

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO20
      mode: INPUT_PULLUP
      inverted: True
    name: "Button"
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "Status"

output:
  - platform: gpio
    id: power_led
    pin:
      number: GPIO6
      inverted: True

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 10s
  # Calibration converted from Tasmota: PowerCal 9058, VoltageCal 1465, CurrentCal 3142
  - platform: hlw8012
    model: BL0937
    sel_pin:
      number: GPIO5
      inverted: True # non-inverted reported voltage as current
    cf_pin: GPIO7
    cf1_pin: GPIO3
    voltage_divider: 1522
    current_resistor: 0.001241
    update_interval: 10s
    change_mode_every: 3
    current:
      name: "Current"
      accuracy_decimals: 2
    voltage:
      name: "Voltage"
      accuracy_decimals: 1
    power:
      name: "Power"
      accuracy_decimals: 1
      id: my_power
      filters:
        # voltage_divider/current_resistor can't match all three Tasmota cals at once
        - multiply: 1.1673
  - platform: total_daily_energy
    name: "Daily Energy"
    power_id: my_power

switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO4
    id: relay
    restore_mode: ${relay_restore_mode}
    on_turn_on:
      - output.turn_on: power_led
    on_turn_off:
      - output.turn_off: power_led

time:
  - platform: sntp
    id: my_time

status_led:
  pin:
    number: GPIO1
    inverted: True

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
